###############################################################################
# AiSOC — Dokploy DEV deployment (build-from-source, writable)
#
# Deployed via Dokploy "Docker Compose" service type from VortiQ-x/AiSOC-Fork.
# Set Compose Path to: ./docker-compose.dokploy.yml
#
# WHAT THIS IS — and how it differs from the pull-only variant
# ------------------------------------------------------------
# This file is built for ACTIVE DEVELOPMENT on the fork:
#
#   * BUILD FROM SOURCE. Every app service has a `build:` block + `pull_policy:
#     build`, so `git push` to the fork → Dokploy rebuild → your code edits
#     appear. Nothing is pulled from ghcr.io/beenuar (upstream). Enable
#     Dokploy's auto-deploy webhook to make push→live automatic.
#     Trade-off: the FIRST deploy compiles ~15 Dockerfiles (Go + Python +
#     Next.js) — expect 10–15 min and high RAM during build. Redeploys only
#     rebuild changed services (BuildKit cache).
#
#   * WRITES ENABLED. `AISOC_DEMO_MODE` is deliberately left UNSET (defaults
#     false) so the API's DemoModeMiddleware does NOT reject mutating requests.
#     The web image is built with NEXT_PUBLIC_DEMO_MODE="" so the UI shows write
#     buttons and no banner. You can create/update/delete for real.
#
#   * AUTO-ADMIN, no login setup. `ENV=development` puts the API in auth-bypass
#     mode (app.core.config.AUTH_BYPASS_ENVIRONMENTS): a token-less request
#     resolves to the seeded admin user demo@tryaisoc.com. The console is usable
#     immediately as admin. (The seeded user demo@tryaisoc.com / aisoc-demo also
#     works at /login if you ever switch ENV to production.)
#
#   * DIRECT DB INJECTION. Postgres port 5432 is published on the Dokploy VM so
#     you can connect with psql/DBeaver from your machine via the VM's IP and
#     write/inject rows directly. Schema is created by the migrations mounted at
#     ./services/api/migrations on first boot of an empty volume.
#
# EXCLUDED vs the root compose: kafka-ui, prometheus, grafana, alertmanager,
# honeytokens, purple-team, osquery-tls, slack-bot, demo-producer.
#
# ⚠️  SECURITY — this is a DEV configuration. Auth-bypass is ON and writes are
# open. Do NOT expose the domain to the public internet without Cloudflare
# Access / IP allowlist. The published Postgres port is for an INTERNAL dev VM
# only. For a real multi-user install, flip ENV=production, drop the 5432
# publish, and build web with demo mode off + real auth.
#
# REQUIRED ENVIRONMENT (Dokploy → Environment, never commit)
# ----------------------------------------------------------
#   POSTGRES_PASSWORD     strong random
#   REDIS_PASSWORD        strong random
#   CLICKHOUSE_PASSWORD   strong random
#   NEO4J_PASSWORD        strong random, min 8 chars
#   SECRET_KEY            strong random, >=32 chars
#   LLM_BASE_URL          http://192.168.20.12:4000/v1   (LiteLLM router)
#   LLM_API_KEY           a LiteLLM virtual key (not the master key)
# OPTIONAL
#   LLM_MODEL             defaults to qwen2.5-32b
#   AISOC_PUBLIC_URL      https://your-domain — added to API CORS origins
###############################################################################

networks:
  aisoc:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  clickhouse_data:
  opensearch_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:

services:

  # ─── Infrastructure (pulled images — you won't be editing these) ────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aisoc
      POSTGRES_USER: aisoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy}
    # Published on the VM for direct injection with psql/DBeaver via the VM IP.
    # Host side is 55432 (not 5432) because this dev VM already runs other
    # Postgres instances on 5432 — a bare 5432 publish fails with "port is
    # already allocated". Container port stays 5432, so nothing inside the
    # stack changes; connect from your machine to <VM-IP>:55432.
    # Dev-VM only. Remove this block for any internet-facing deployment.
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - aisoc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisoc"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in Dokploy}
    volumes:
      - redis_data:/data
    networks:
      - aisoc
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aisoc
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks:
      - aisoc
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1536m
    mem_reservation: 1g
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./services/api/clickhouse:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: aisoc
      CLICKHOUSE_USER: aisoc
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in Dokploy}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - aisoc
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 1g
    mem_reservation: 768m
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - cluster.name=aisoc-cluster
      - node.name=aisoc-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - aisoc
    mem_limit: 1g
    mem_reservation: 768m
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.0
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aisoc
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in Dokploy (min 8 chars)}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - aisoc
    mem_limit: 1g
    mem_reservation: 768m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ─── Application Services (BUILT FROM FORK SOURCE) ──────────────────────────
  # pull_policy: build forces a local build every time and prevents any
  # accidental pull of the upstream ghcr.io/beenuar images. `image:` is just the
  # local tag the built image gets.

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: aisoc-fork/api:local
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc:${POSTGRES_PASSWORD}@postgres:5432/aisoc
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_URL: http://aisoc:${CLICKHOUSE_PASSWORD}@clickhouse:8123/aisoc
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: aisoc
      CLICKHOUSE_USER: aisoc
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      OPENSEARCH_URL: http://opensearch:9200
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in Dokploy (>=32 chars)}
      # ENV=development → auth bypass (admin) is ON. AISOC_DEMO_MODE is left
      # unset → writes are ENABLED. This is the dev sweet spot.
      ENV: development
      ENVIRONMENT: development
      LOG_LEVEL: info
      CORS_ORIGINS: ${AISOC_PUBLIC_URL:-}
      AGENTS_SERVICE_URL: http://agents:8084
      FUSION_URL: http://fusion:8003
      AISOC_AIRGAPPED: "true"
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL in Dokploy}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in Dokploy}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-32b}
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=2); sys.exit(0 if r.status==200 else 1)\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - aisoc
    restart: unless-stopped

  ingest-worker:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile
    image: aisoc-fork/ingest:local
    pull_policy: build
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      ENV: development
      HTTP_PORT: 8080
      METRICS_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      LOG_LEVEL: info
      JWT_SECRET: ${SECRET_KEY}
      ATTCK_DATA_PATH: /app/data/enterprise-attack.json
      AISOC_GRAPH_ENABLED: "true"
      AISOC_NEO4J_URI: bolt://neo4j:7687
      AISOC_NEO4J_USER: neo4j
      AISOC_NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    networks:
      - aisoc
    restart: unless-stopped

  enrichment:
    build:
      context: ./services/enrichment
      dockerfile: Dockerfile
    image: aisoc-fork/enrichment:local
    pull_policy: build
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
    networks:
      - aisoc
    restart: unless-stopped

  fusion:
    build:
      context: ./services/fusion
      dockerfile: Dockerfile
    image: aisoc-fork/fusion:local
    pull_policy: build
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      DATABASE_URL: postgresql+asyncpg://aisoc:${POSTGRES_PASSWORD}@postgres:5432/aisoc
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_DATABASE: aisoc
      CLICKHOUSE_USER: aisoc
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    networks:
      - aisoc
    restart: unless-stopped

  agents:
    build:
      context: ./services/agents
      dockerfile: Dockerfile
    image: aisoc-fork/agents:local
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc:${POSTGRES_PASSWORD}@postgres:5432/aisoc
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/4
      CORE_API_URL: http://api:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_ALERTS_FUSED: aisoc.alerts.fused
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ATTCK_DATA_PATH: /app/data/enterprise-attack.json
      ENV: development
      # Local LLM via LiteLLM. AISOC_AIRGAPPED blocks egress to api.openai.com
      # and refuses an empty base_url, closing the silent OpenAI-cloud fallback.
      AISOC_AIRGAPPED: "true"
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-32b}
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    networks:
      - aisoc
    restart: unless-stopped

  actions:
    build:
      context: ./services/actions
      dockerfile: Dockerfile
    image: aisoc-fork/actions:local
    pull_policy: build
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/5
      DATABASE_URL: postgresql+asyncpg://aisoc:${POSTGRES_PASSWORD}@postgres:5432/aisoc
      CORE_API_URL: http://api:8000
    networks:
      - aisoc
    restart: unless-stopped

  connectors:
    build:
      context: ./services/connectors
      dockerfile: Dockerfile
    image: aisoc-fork/connectors:local
    pull_policy: build
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/6
      DATABASE_URL: postgresql+asyncpg://aisoc:${POSTGRES_PASSWORD}@postgres:5432/aisoc
      CORE_API_URL: http://api:8000
      CROWDSTRIKE_CLIENT_ID: ${CROWDSTRIKE_CLIENT_ID:-}
      CROWDSTRIKE_CLIENT_SECRET: ${CROWDSTRIKE_CLIENT_SECRET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    networks:
      - aisoc
    restart: unless-stopped

  threatintel:
    build:
      context: ./services/threatintel
      dockerfile: Dockerfile
    image: aisoc-fork/threatintel:local
    pull_policy: build
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/7
      OPENSEARCH_URL: http://opensearch:9200
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MISP_URL: ${MISP_URL:-}
      MISP_API_KEY: ${MISP_API_KEY:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      TAXII_URL: ${TAXII_URL:-}
      TAXII_USERNAME: ${TAXII_USERNAME:-}
      TAXII_PASSWORD: ${TAXII_PASSWORD:-}
      AISOC_AIRGAPPED: "true"
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-32b}
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
    networks:
      - aisoc
    restart: unless-stopped

  ueba:
    build:
      context: ./services/ueba
      dockerfile: Dockerfile
    image: aisoc-fork/ueba:local
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc:${POSTGRES_PASSWORD}@postgres:5432/aisoc
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/8
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_URL: http://aisoc:${CLICKHOUSE_PASSWORD}@clickhouse:8123/aisoc
      CORE_API_URL: http://api:8000
    networks:
      - aisoc
    restart: unless-stopped

  realtime:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    image: aisoc-fork/realtime:local
    pull_policy: build
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 4000
    networks:
      - aisoc
    restart: unless-stopped

  # ─── One-shot demo seeder ───────────────────────────────────────────────────
  # Populates the seeded admin user (demo@tryaisoc.com / aisoc-demo) + 15
  # INC-RT-* incidents + 28 alerts. Idempotent. Even in a "fill my own data"
  # workflow you want this to run at least once — it creates the admin user the
  # auth-bypass resolves to. Remove/scale-to-0 later if you don't want the demo
  # incidents. Builds the same image as `api`.
  seed:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: aisoc-fork/api:local
    pull_policy: build
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc:${POSTGRES_PASSWORD}@postgres:5432/aisoc
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ENV: development
      ENVIRONMENT: development
      LOG_LEVEL: info
      AISOC_DISABLE_KAFKA: "true"
    networks:
      - aisoc
    restart: "no"
    command: ["python", "-m", "app.scripts.seed_demo"]

  # ─── Web console (built with demo mode OFF so writes are usable) ────────────
  # Service names api/agents/realtime must not be renamed — the built bundle
  # bakes them as proxy targets into routes-manifest.json.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Server-side proxy targets (Docker DNS). Baked at build time.
        API_URL: http://api:8000
        AGENTS_URL: http://agents:8084
        REALTIME_URL: http://realtime:4000
        # Empty → browser issues same-origin relative paths, Next proxies them.
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_WS_URL: ""
        # THE write-enable switch: empty disables all frontend demo gating
        # (no read-only UI, no banner, no forced auto-login).
        NEXT_PUBLIC_DEMO_MODE: ""
    image: aisoc-fork/web:local
    pull_policy: build
    depends_on:
      - api
      - agents
      - realtime
    environment:
      API_URL: http://api:8000
      AGENTS_URL: http://agents:8084
      REALTIME_URL: http://realtime:4000
      NODE_ENV: production
    networks:
      - aisoc
      - dokploy-network
    restart: unless-stopped
